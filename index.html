<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TOKS SERVİS">
  <title>TOKS // SERVİS SİSTEMİ</title>
  
  <!-- PDF ve Grafik Kütüphaneleri -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root { 
      --bg: #06090e; --card-bg: rgba(10, 20, 30, 0.85); --border: #334155; 
      --toks-navy: #0A1D3A; --toks-yellow: #FFCC00; 
      --red: #ff0055; --blue: #00e5ff; --green: #00ff66;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "SF Mono", monospace; }
    body { background-color: var(--bg); color: #fff; padding: 15px; min-height: 100vh; padding-top: 85px; padding-bottom: 40px;}
    
    header { position: fixed; top: 0; left: 0; width: 100%; background: var(--toks-navy); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; border-bottom: 2px solid var(--toks-yellow); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .logo { display: flex; align-items: center; font-size: 1.5rem; font-weight: 900; letter-spacing: -1px; background: #fff; color: var(--toks-navy); padding: 2px 8px; border-radius: 4px; }
    .logo-arrow { color: var(--toks-yellow); font-size: 1.8rem; line-height: 1; margin-left: 2px; }
    
    .info-widget { text-align: right; font-size: 0.7rem; color: #cbd5e1; display: flex; flex-direction: column; align-items: flex-end; }
    .info-widget strong { color: var(--toks-yellow); font-size: 0.8rem; display: block; margin-top: 2px; margin-bottom: 4px; }
    .lock-btn { background: #1e293b; color: #fff; border: 1px solid var(--toks-yellow); padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; font-weight: bold; }

    .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab { flex: 1; padding: 10px 5px; text-align: center; border: 1px solid var(--border); color: #fff; cursor: pointer; font-weight: bold; background: var(--card-bg); border-radius: 4px; font-size: 0.85rem; }
    .tab.active { background: var(--toks-yellow); color: var(--toks-navy); border-color: var(--toks-yellow); }

    .input-panel { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; margin-bottom: 15px; border-radius: 8px; border-top: 3px solid var(--toks-yellow); }
    .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
    
    input, select, datalist { width: 100%; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 10px; font-size: 0.9rem; outline: none; border-radius: 4px; text-transform: uppercase; }
    input:focus, select:focus { border-color: var(--toks-yellow); }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    .btn { width: 100%; background: var(--toks-yellow); color: var(--toks-navy); padding: 12px; font-weight: 900; cursor: pointer; border: none; border-radius: 4px; margin-top: 5px; }
    
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    
    .job-card { background: var(--card-bg); border: 1px solid var(--border); padding: 10px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 6px; font-size: 0.8rem; }
    .plate { font-size: 1.1rem; font-weight: bold; color: var(--toks-yellow); margin-bottom: 2px; }
    .firm { color: #94a3b8; font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task { color: #fff; line-height: 1.2; margin-bottom: 6px; font-size: 0.85rem; }
    .price-tag { font-size: 0.8rem; color: var(--green); font-weight: bold; margin-bottom: 6px; display:flex; align-items:center; }
    
    .timeline { background: #02070d; border-radius: 4px; padding: 6px; margin-bottom: 8px; font-size: 0.6rem; color: #94a3b8; border: 1px solid #1e293b; }
    .timeline div { display: flex; justify-content: space-between; }
    .timeline span { color: var(--toks-yellow); }

    .status-grid { display: flex; gap: 3px; margin-top: auto; }
    .s-btn { flex: 1; padding: 6px 0; font-size: 0.6rem; font-weight: bold; cursor: pointer; border: 1px solid var(--border); border-radius: 4px; background: #0f172a; color: #94a3b8; text-align: center; }
    .s-btn.active-0 { background: var(--red); color: #fff; border-color: var(--red); }
    .s-btn.active-1 { background: var(--toks-yellow); color: var(--toks-navy); border-color: var(--toks-yellow); }
    .s-btn.active-2 { background: var(--blue); color: #000; border-color: var(--blue); }
    .s-btn-archive { background: var(--green); color: var(--toks-navy); border-color: var(--green); }
    
    .folder { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 15px 10px; text-align: center; cursor: pointer; border-bottom: 3px solid var(--toks-navy); }
    .folder-icon { font-size: 2rem; margin-bottom: 5px; }
    .folder-name { font-weight: bold; color: #fff; font-size: 0.85rem; word-break: break-word; }
    .folder-count { font-size: 0.7rem; color: var(--toks-yellow); margin-top: 5px; }
    
    #archiveModal { display: none; margin-top: 15px; }
    .modal-title { font-size: 1.1rem; color: var(--toks-yellow); margin-bottom: 10px; font-weight: bold; }

    /* BÜTÇE EKRANI */
    .budget-card { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .budget-title { color: var(--toks-yellow); font-size: 0.9rem; font-weight: bold; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 5px; }
    .budget-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 6px 0; border-bottom: 1px solid #1e293b; }
    .budget-row:last-child { border: none; }
    .budget-total { font-size: 1.2rem; color: var(--green); font-weight: bold; text-align: right; margin-top: 10px; }
    .chart-container { position: relative; height: 250px; width: 100%; }

    /* Şifre Paneli Özel Tasarımı */
    #pinModalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; }
    .pin-box { background: var(--toks-navy); padding: 25px; border-radius: 8px; border: 2px solid var(--toks-yellow); width: 85%; max-width: 320px; text-align: center; }
    .pin-box h3 { color: var(--toks-yellow); margin-bottom: 15px; font-size: 1.1rem; }
    .pin-box input { width: 100%; text-align: center; font-size: 1.8rem; letter-spacing: 8px; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 2px solid var(--border); background: #06090e; color: #fff; -webkit-text-security: disc; }
    .pin-box input:focus { border-color: var(--toks-yellow); }
    .pin-buttons { display: flex; gap: 10px; }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center;">
      <div class="logo">TOKS</div><div class="logo-arrow">〉</div>
    </div>
    <div class="info-widget">
      <div id="clock">Yükleniyor...</div>
      <strong id="euro-rate">€1 = Bekleniyor...</strong>
      <button class="lock-btn" id="lockBtn" onclick="toggleAllPrices()">🔒 Tümünü Aç</button>
    </div>
  </header>

  <!-- Sekmeler -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('active')" id="tab-active">AKTİF İŞLER</div>
    <div class="tab" onclick="switchTab('archive')" id="tab-archive">ARŞİV</div>
    <div class="tab" onclick="switchTab('budget')" id="tab-budget">BÜTÇE</div>
  </div>

  <!-- AKTİF İŞLER -->
  <div id="view-active">
    <div class="input-panel">
      <div class="input-row">
        <input type="text" id="plate" placeholder="PLAKA (Örn: 35 TOKS 01)" oninput="this.value = this.value.toUpperCase()">
        <input type="text" id="firm" placeholder="MÜŞTERİ / FİRMA" style="width: 50%;">
      </div>
      <div class="input-row">
        <input type="number" inputmode="numeric" pattern="[0-9]*" id="receipt" placeholder="FİŞ NO (Örn: 350052)">
        <div id="priceContainer" style="display: flex; width: 50%; gap: 5px;">
          <input type="number" inputmode="numeric" pattern="[0-9]*" id="price" placeholder="FİYAT (KDV HARİÇ)" style="width: 100%;">
          <select id="currency" style="width: 70px; padding: 10px; background: #0f172a; color: #fff; border: 1px solid var(--border); border-radius: 4px; outline: none;">
            <option value="TRY">₺</option>
            <option value="EUR">€</option>
          </select>
        </div>
      </div>
      <input type="text" id="task" list="taskList" placeholder="YAPILACAK İŞLEMİ SEÇ VEYA YAZ">
      <datalist id="taskList">
        <option value="BRANDA YAMA">
        <option value="MERDİVEN MONTAJI">
        <option value="KAPAK TAMİRİ">
        <option value="ÇATI KALDIRMA MEKANİZMASI">
        <option value="KAYNAK İŞLEMİ">
      </datalist>
      <div style="display:flex; gap:10px;">
        <button class="btn" id="saveBtn" onclick="saveJob()">SİSTEME KAYDET</button>
        <button class="btn" id="cancelBtn" onclick="cancelEdit()" style="display:none; background:var(--red); color:#fff; width:30%;">İPTAL</button>
      </div>
    </div>
    
    <div class="grid-container" id="jobList"></div>
  </div>

  <!-- ARŞİV GÖRÜNÜMÜ -->
  <div id="view-archive" style="display:none;">
    <div class="grid-container" id="folderList"></div>
    <div id="archiveModal">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div class="modal-title" id="modalTitle" style="margin:0;"></div>
        <button onclick="closeModal()" style="background:var(--border); color:#fff; border:none; padding:8px 15px; border-radius:4px; font-weight:bold; cursor:pointer;">← Geri Dön</button>
      </div>
      <div class="grid-container" id="modalJobs"></div>
    </div>
  </div>

  <!-- BÜTÇE GÖRÜNÜMÜ (Yeni) -->
  <div id="view-budget" style="display:none;">
    <div class="budget-card">
      <div class="budget-title">FİRMA CARİ DAĞILIMI (ARŞİVLENEN İŞLER)</div>
      <div id="firmBalances"></div>
      <div class="budget-total" id="grandTotal">TOPLAM: 0 ₺</div>
    </div>

    <div class="budget-card">
      <div class="budget-title">FİRMA KAZANÇ ORANI</div>
      <div class="chart-container">
        <canvas id="pieChart"></canvas>
      </div>
    </div>

    <div class="budget-card">
      <div class="budget-title">AYLIK GELİR GRAFİĞİ</div>
      <div class="chart-container">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </div>

  <!-- ÖZEL ŞİFRE (PIN) MODALI -->
  <div id="pinModalOverlay">
    <div class="pin-box">
      <h3>Sisteme Şifre Giriniz</h3>
      <input type="tel" id="pinInput" placeholder="****" style="-webkit-text-security: disc;">
      <div class="pin-buttons">
        <button class="btn" style="background:#334155; color:#fff;" onclick="closePinModal()">İPTAL</button>
        <button class="btn" onclick="submitPin()">ONAYLA</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    let globalUnlock = false;
    let unlockedIndices = new Set();
    let currentEuroRate = 1;
    let editingIndex = -1; // Düzenleme modu koruması
    let pieChartInstance = null;
    let barChartInstance = null;

    // --- PIN SİSTEMİ ---
    let pinSuccessCallback = null;
    let pinCancelCallback = null;

    function showPinModal(onSuccess, onCancel) {
      pinSuccessCallback = onSuccess;
      pinCancelCallback = onCancel;
      document.getElementById('pinModalOverlay').style.display = 'flex';
      const input = document.getElementById('pinInput');
      input.value = '';
      setTimeout(() => input.focus(), 100);
    }

    function closePinModal() {
      document.getElementById('pinModalOverlay').style.display = 'none';
      if (pinCancelCallback) pinCancelCallback();
      pinSuccessCallback = null;
      pinCancelCallback = null;
    }

    function submitPin() {
      const pin = document.getElementById('pinInput').value.trim();
      if (pin === "1907") {
        if (pinSuccessCallback) pinSuccessCallback();
        document.getElementById('pinModalOverlay').style.display = 'none';
      } else {
        alert("Hatalı Şifre!");
        document.getElementById('pinInput').value = '';
        document.getElementById('pinInput').focus();
      }
    }

    document.getElementById("pinInput").addEventListener("keyup", function(event) {
      if (event.key === "Enter") { submitPin(); }
    });

    // --- KİLİT MANTIK ---
    function toggleSinglePrice(index) {
      showPinModal(() => { unlockedIndices.add(index); renderAll(); }, null);
    }
    function lockSinglePrice(index) {
      unlockedIndices.delete(index); renderAll();
    }
    function toggleAllPrices() {
      if (globalUnlock) {
        globalUnlock = false;
        unlockedIndices.clear();
        document.getElementById('lockBtn').innerText = "🔒 Tümünü Aç";
        renderAll();
      } else {
        showPinModal(() => { forceUnlockAll(); }, null);
      }
    }
    function forceUnlockAll() {
      globalUnlock = true;
      document.getElementById('lockBtn').innerText = "🔓 Tümünü Gizle";
      renderAll();
    }

    // --- SAAT VE KUR ---
    function updateClock() { document.getElementById('clock').innerText = new Date().toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' }); }
    updateClock(); setInterval(updateClock, 1000);

    fetch('https://open.er-api.com/v6/latest/EUR')
      .then(res => res.json())
      .then(data => { 
        currentEuroRate = data.rates.TRY;
        document.getElementById('euro-rate').innerText = "€1 = " + currentEuroRate.toFixed(2) + " ₺"; 
      })
      .catch(() => { document.getElementById('euro-rate').innerText = "Kur Alınamadı"; });

    // --- FİREBASE ---
    const firebaseConfig = {
      apiKey: "AIzaSyBdJ2_Vs53h9dJq_KJciNPWix6OFvOZR5Y",
      authDomain: "toks-servis.firebaseapp.com",
      databaseURL: "https://toks-servis-default-rtdb.firebaseio.com",
      projectId: "toks-servis",
      storageBucket: "toks-servis.firebasestorage.app",
      messagingSenderId: "686093119969",
      appId: "1:686093119969:web:9c48f375479f65822062a0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('toks_jobs');

    let jobs = [];
    let currentTab = 'active';

    db.on('value', (snapshot) => {
      jobs = snapshot.val() || [];
      renderAll();
    });

    function switchTab(tab) {
      if (tab === 'budget' && !globalUnlock) {
        showPinModal(() => {
          forceUnlockAll();
          switchTabInternal(tab);
        }, () => {
          // İptal edilirse önceki sekmede kal
        });
        return;
      }
      switchTabInternal(tab);
    }

    function switchTabInternal(tab) {
      currentTab = tab;
      document.getElementById('tab-active').classList.toggle('active', tab === 'active');
      document.getElementById('tab-archive').classList.toggle('active', tab === 'archive');
      document.getElementById('tab-budget').classList.toggle('active', tab === 'budget');
      document.getElementById('view-active').style.display = tab === 'active' ? 'block' : 'none';
      document.getElementById('view-archive').style.display = tab === 'archive' ? 'block' : 'none';
      document.getElementById('view-budget').style.display = tab === 'budget' ? 'block' : 'none';
      closeModal();
      renderAll();
    }

    function renderAll() {
      if(currentTab === 'active') renderActive();
      else if(currentTab === 'archive') renderFolders();
      else if(currentTab === 'budget') renderBudget();
    }

    function renderActive() {
      const list = document.getElementById('jobList');
      list.innerHTML = '';
      jobs.forEach((job, index) => {
        if(!job || job.status === 3) return;
        let c0 = job.status === 0 ? 'active-0' : ''; let c1 = job.status === 1 ? 'active-1' : ''; let c2 = job.status === 2 ? 'active-2' : '';
        let borderColor = job.status === 0 ? 'var(--red)' : (job.status === 1 ? 'var(--toks-yellow)' : 'var(--blue)');
        const hist = job.history || {};
        let displayPrice = (globalUnlock || unlockedIndices.has(index)) ? 
          `${job.price || 'Belirtilmemiş'} <span onclick="lockSinglePrice(${index})" style="cursor:pointer; margin-left:8px;" title="Gizle">🔓</span>` : 
          `<span onclick="toggleSinglePrice(${index})" style="cursor:pointer; background:#1e293b; padding:3px 8px; border-radius:4px; color:#FFCC00; font-size:0.75rem;">🔒 Fiyatı Gör</span>`;
        list.innerHTML += `
          <div class="job-card" style="border-top: 3px solid ${borderColor};">
            <div>
              <div class="plate">${job.plate || ''} <span style="font-size:0.7rem; color:#94a3b8;">(Fiş: ${job.receipt || '-'})</span></div>
              <div class="firm">${job.firm || ''}</div>
              <div class="task">${job.task || ''}</div>
              <div class="price-tag">Tutar: ${displayPrice}</div>
              <div class="timeline">
                <div><span>Bekliyor:</span> ${(hist.waiting || '-').slice(-5)}</div>
                <div><span>İşlemde:</span> ${(hist.inProgress || '-').slice(-5)}</div>
                <div><span>Bitti:</span> ${(hist.finished || '-').slice(-5)}</div>
              </div>
            </div>
            <div>
              <div class="status-grid" style="margin-bottom: 4px;">
                <button class="s-btn ${c0}" onclick="updateStatus(${index}, 0)">BEKLE</button>
                <button class="s-btn ${c1}" onclick="updateStatus(${index}, 1)">İŞLEM</button>
                <button class="s-btn ${c2}" onclick="updateStatus(${index}, 2)">BİTTİ</button>
                <button class="s-btn s-btn-archive" onclick="updateStatus(${index}, 3)">ARŞİV</button>
              </div>
              <div style="display:flex; justify-content:space-between; margin-top:4px;">
                <button onclick="editJob(${index})" style="background:transparent; border:1px solid #cbd5e1; color:#cbd5e1; font-size:0.6rem; padding:2px 8px; border-radius:3px;">DÜZENLE</button>
                <button onclick="deleteJob(${index})" style="background:transparent; border:1px solid var(--red); color:var(--red); font-size:0.6rem; padding:2px 8px; border-radius:3px;">SİL</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    let archiveFirms = {};
    function renderFolders() {
      const list = document.getElementById('folderList'); list.innerHTML = ''; archiveFirms = {};
      jobs.forEach((job, index) => {
        if(job && job.status === 3) {
          let fname = job.firm || "BİLİNMEYEN FİRMA";
          if(!archiveFirms[fname]) archiveFirms[fname] = [];
          archiveFirms[fname].push({ ...job, originalIndex: index });
        }
      });
      for (const [firmName, firmJobs] of Object.entries(archiveFirms)) {
        list.innerHTML += `
          <div class="folder" onclick="openModal('${firmName.replace(/'/g, "\\'")}')">
            <div class="folder-icon">🗂️</div><div class="folder-name">${firmName}</div>
            <div class="folder-count">${firmJobs.length} İşlem</div>
          </div>
        `;
      }
    }

    function openModal(firmName) {
      document.getElementById('folderList').style.display = 'none';
      document.getElementById('archiveModal').style.display = 'block';
      document.getElementById('modalTitle').innerText = "🗂️ " + firmName;
      const list = document.getElementById('modalJobs'); list.innerHTML = '';
      if(archiveFirms[firmName]) {
        archiveFirms[firmName].forEach(job => {
          let actIdx = job.originalIndex;
          let displayPrice = (globalUnlock || unlockedIndices.has(actIdx)) ? 
            `${job.price || 'Belirtilmemiş'} <span onclick="lockSinglePrice(${actIdx})" style="cursor:pointer; margin-left:8px;">🔓</span>` : 
            `<span onclick="toggleSinglePrice(${actIdx})" style="background:#1e293b; padding:3px 8px; border-radius:4px; color:#FFCC00; font-size:0.75rem;">🔒 Fiyatı Gör</span>`;
          list.innerHTML += `
            <div class="job-card" style="border-top: 3px solid var(--green);">
              <div>
                <div class="plate">${job.plate || ''} <span style="font-size:0.7rem; color:var(--toks-yellow);">(Fiş: ${job.receipt || '-'})</span></div>
                <div class="task">${job.task || ''}</div>
                <div class="price-tag">Tutar: ${displayPrice}</div>
              </div>
              <div>
                <button class="btn" style="background:var(--toks-yellow); color:var(--toks-navy); padding:8px; font-size:0.75rem; margin-bottom:5px;" onclick="generatePDF(${actIdx})">📄 PDF İNDİR</button>
                <div style="display:flex; gap:5px;">
                  <button class="s-btn" style="background:var(--border); color:#fff; padding:6px;" onclick="updateStatus(${actIdx}, 0)">GERİ AL</button>
                  <button class="s-btn" style="background:var(--border); color:#cbd5e1; padding:6px;" onclick="editJob(${actIdx})">DÜZENLE</button>
                  <button class="s-btn" style="background:var(--red); color:#fff; padding:6px;" onclick="deleteJob(${actIdx})">SİL</button>
                </div>
              </div>
            </div>
          `;
        });
      }
    }
    function closeModal() { document.getElementById('archiveModal').style.display = 'none'; document.getElementById('folderList').style.display = 'grid'; }

    // --- BÜTÇE İSTATİSTİKLERİ (Grafik) ---
    function renderBudget() {
      let companyTotals = {};
      let monthTotals = {};
      let grandTotal = 0;

      jobs.forEach(job => {
        if(job && job.status === 3) { // Sadece arşivlenen/teslim edilenler
          let priceStr = job.price || "";
          let amount = parseFloat(priceStr) || 0;
          if(priceStr.includes('€') || priceStr.includes('EUR')) { amount = amount * currentEuroRate; } // Euro yu anlık kurdan TRY'ye çevir
          
          let firm = job.firm || "BİLİNMEYEN FİRMA";
          companyTotals[firm] = (companyTotals[firm] || 0) + amount;
          grandTotal += amount;

          let fDate = (job.history && job.history.finished !== '-') ? job.history.finished : job.time;
          if (fDate) {
            let parts = fDate.split(' ')[0].split('.');
            if(parts.length === 3) {
              let monthKey = `${parts[1]}/${parts[2]}`; // MM/YYYY
              monthTotals[monthKey] = (monthTotals[monthKey] || 0) + amount;
            }
          }
        }
      });

      // Şirket Listesi
      let listHTML = "";
      for (const [firm, total] of Object.entries(companyTotals)) {
        listHTML += `<div class="budget-row"><span>🏢 ${firm}</span><span style="color:var(--green); font-weight:bold;">${Math.round(total).toLocaleString('tr-TR')} ₺</span></div>`;
      }
      document.getElementById('firmBalances').innerHTML = listHTML;
      document.getElementById('grandTotal').innerText = `TOPLAM: ${Math.round(grandTotal).toLocaleString('tr-TR')} ₺`;

      // Grafikler
      if(pieChartInstance) pieChartInstance.destroy();
      if(barChartInstance) barChartInstance.destroy();

      const ctxPie = document.getElementById('pieChart').getContext('2d');
      pieChartInstance = new Chart(ctxPie, {
        type: 'pie',
        data: {
          labels: Object.keys(companyTotals),
          datasets: [{
            data: Object.values(companyTotals),
            backgroundColor: ['#FFCC00', '#00e5ff', '#ff0055', '#00ff66', '#a855f7', '#f97316', '#3b82f6'],
            borderWidth: 1, borderColor: '#06090e'
          }]
        },
        options: { plugins: { legend: { position: 'right', labels: { color: '#cbd5e1', font: {size: 10} } } }, maintainAspectRatio: false }
      });

      const ctxBar = document.getElementById('barChart').getContext('2d');
      barChartInstance = new Chart(ctxBar, {
        type: 'bar',
        data: {
          labels: Object.keys(monthTotals).sort(),
          datasets: [{
            label: 'Aylık Gelir (₺)',
            data: Object.keys(monthTotals).sort().map(k => monthTotals[k]),
            backgroundColor: '#FFCC00', borderRadius: 4
          }]
        },
        options: { plugins: { legend: { display: false } }, scales: { y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }, x: { ticks: { color: '#cbd5e1' }, grid: { display: false } } }, maintainAspectRatio: false }
      });
    }


    // --- DÜZENLEME (Geçmişi Korumalı) VE KAYIT SİSTEMİ ---
    function executeEditJob(index) {
      switchTabInternal('active');
      window.scrollTo({ top: 0, behavior: 'smooth' });
      editingIndex = index;
      const job = jobs[index];
      
      document.getElementById('plate').value = job.plate || '';
      document.getElementById('firm').value = job.firm || '';
      document.getElementById('receipt').value = job.receipt || '';
      
      if(job.price) {
        document.getElementById('currency').value = job.price.includes('€') ? 'EUR' : 'TRY';
        try { document.getElementById('price').value = Math.round(parseFloat(job.price.split(' ')[0]) / 1.2); } catch(e) {}
      }
      document.getElementById('task').value = job.task || '';
      
      document.getElementById('saveBtn').innerText = "SİSTEMİ GÜNCELLE";
      document.getElementById('saveBtn').style.background = "var(--blue)";
      document.getElementById('cancelBtn').style.display = "block";
    }

    function editJob(index) {
      if(!globalUnlock) {
        showPinModal(() => { forceUnlockAll(); executeEditJob(index); }, null);
      } else {
        executeEditJob(index);
      }
    }

    function cancelEdit() {
      editingIndex = -1;
      document.getElementById('plate').value = ''; document.getElementById('firm').value = '';
      document.getElementById('receipt').value = ''; document.getElementById('price').value = '';
      document.getElementById('task').value = '';
      document.getElementById('saveBtn').innerText = "SİSTEME KAYDET";
      document.getElementById('saveBtn').style.background = "var(--toks-yellow)";
      document.getElementById('cancelBtn').style.display = "none";
    }

    function saveJob() {
      const plate = document.getElementById('plate').value.trim().toUpperCase();
      const firm = document.getElementById('firm').value.trim().toUpperCase() || "BİLİNMEYEN FİRMA";
      const receipt = document.getElementById('receipt').value.trim() || "-";
      const task = document.getElementById('task').value.trim().toUpperCase();
      const rawPrice = document.getElementById('price').value;
      const curr = document.getElementById('currency').value;
      
      if(!plate || !task) { alert("Plaka ve İşlem boş bırakılamaz!"); return; }
      
      let finalPrice = "";
      if (rawPrice && !isNaN(rawPrice)) {
        finalPrice = curr === 'EUR' ? (parseFloat(rawPrice) * 1.2).toFixed(2) + " € (KDV Dahil)" : (parseFloat(rawPrice) * 1.2).toFixed(2) + " ₺ (KDV Dahil)";
      }

      if (editingIndex > -1) {
        // GEÇMİŞİ BOZMADAN SADECE BİLGİLERİ GÜNCELLE
        jobs[editingIndex].plate = plate;
        jobs[editingIndex].firm = firm;
        jobs[editingIndex].receipt = receipt;
        jobs[editingIndex].task = task;
        jobs[editingIndex].price = finalPrice;
        db.set(jobs);
        cancelEdit(); // Ekranı temizle ve butonu sıfırla
      } else {
        // YENİ İŞ KAYDI
        const currentTime = new Date().toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
        jobs.push({ plate, firm, receipt, task, price: finalPrice, status: 0, history: { waiting: currentTime, inProgress: '-', finished: '-' } });
        db.set(jobs);
        cancelEdit();
      }
    }

    function updateStatus(index, newStatus) {
      jobs[index].status = newStatus;
      const currentTime = new Date().toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
      if(!jobs[index].history) jobs[index].history = { waiting: '-', inProgress: '-', finished: '-' };
      if(newStatus === 0) jobs[index].history.waiting = currentTime;
      if(newStatus === 1) jobs[index].history.inProgress = currentTime;
      if(newStatus === 2) jobs[index].history.finished = currentTime;
      db.set(jobs); closeModal();
    }
    function deleteJob(index) { if(confirm("Bu kaydı silmek istediğine emin misin?")) { jobs.splice(index, 1); db.set(jobs); closeModal(); } }

      doc.setDrawColor(255, 204, 0); doc.setLineWidth(1.5); doc.line(15, 45, 195, 45);

      doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(0, 0, 0);
      doc.text(`Merhaba ${job.firm || ''} firmasi, islemde olan`, 15, 65); doc.text(`${job.plate || ''} plakali araciniz icin asagida yapilan islem ve ucret bilgisi yer almaktadir.`, 15, 72);
      doc.setDrawColor(200, 200, 200); doc.setFillColor(245, 247, 250); doc.roundedRect(15, 85, 180, 65, 3, 3, 'FD');
      doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(10, 29, 58); doc.text("SERVIS VE ISLEM DETAYLARI", 23, 97);
      doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(0, 0, 0); doc.text(`Yapilan Islem: ${job.task || ''}`, 23, 109);
      let pdfPrice = (job.price || 'Belirtilmemis').replace('₺', 'TL').replace('€', 'EUR'); doc.text(`Toplam Tutar: ${pdfPrice}`, 23, 119);
      const hist = job.history || {}; doc.text(`Arac Giris Saati: ${hist.waiting || '-'}`, 23, 129); doc.text(`Islem Cikis Saati: ${hist.finished || '-'}`, 23, 139);
      const safeFirm = (job.firm || 'FIRMA').replace(/[^a-zA-Z0-9]/g, '_'); const safePlate = (job.plate || 'PLAKA').replace(/[^a-zA-Z0-9]/g, '');
      doc.save(`${safeFirm}_${safePlate}.pdf`);
    }
  </script>
