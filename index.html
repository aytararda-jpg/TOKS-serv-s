<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TOKS SERVİS">
  <title>TOKS // SERVİS SİSTEMİ</title>
  <style>
    :root { 
      --bg: #06090e; --card-bg: rgba(10, 20, 30, 0.85); --border: #334155; 
      --toks-navy: #0A1D3A; --toks-yellow: #FFCC00; 
      --red: #ff0055; --blue: #00e5ff; --green: #00ff66;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "SF Mono", monospace; }
    body { background-color: var(--bg); color: #fff; padding: 15px; min-height: 100vh; padding-top: 70px; }
    
    header { position: fixed; top: 0; left: 0; width: 100%; background: var(--toks-navy); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; z-index: 100; border-bottom: 2px solid var(--toks-yellow); box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .logo { display: flex; align-items: center; font-size: 1.5rem; font-weight: 900; letter-spacing: -1px; background: #fff; color: var(--toks-navy); padding: 2px 8px; border-radius: 4px; }
    .logo-arrow { color: var(--toks-yellow); font-size: 1.8rem; line-height: 1; margin-left: 2px; }
    
    .info-widget { text-align: right; font-size: 0.7rem; color: #cbd5e1; }
    .info-widget strong { color: var(--toks-yellow); font-size: 0.8rem; display: block; margin-top: 2px; }

    .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab { flex: 1; padding: 10px; text-align: center; border: 1px solid var(--border); color: #fff; cursor: pointer; font-weight: bold; background: var(--card-bg); border-radius: 4px; }
    .tab.active { background: var(--toks-yellow); color: var(--toks-navy); border-color: var(--toks-yellow); }

    .input-panel { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; margin-bottom: 15px; border-radius: 8px; border-top: 3px solid var(--toks-yellow); }
    .input-row { display: flex; gap: 10px; margin-bottom: 10px; }
    input, select, datalist { width: 100%; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 10px; font-size: 0.9rem; outline: none; border-radius: 4px; text-transform: uppercase; }
    input:focus, select:focus { border-color: var(--toks-yellow); }
    
    .btn { width: 100%; background: var(--toks-yellow); color: var(--toks-navy); padding: 12px; font-weight: 900; cursor: pointer; border: none; border-radius: 4px; margin-top: 5px; }
    
    /* Kompakt Izgara Düzeni (2 Sütun) */
    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
    
    .job-card { background: var(--card-bg); border: 1px solid var(--border); padding: 10px; display: flex; flex-direction: column; justify-content: space-between; border-radius: 6px; font-size: 0.8rem; }
    .plate { font-size: 1.1rem; font-weight: bold; color: var(--toks-yellow); margin-bottom: 2px; }
    .firm { color: #94a3b8; font-size: 0.75rem; font-weight: bold; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task { color: #fff; line-height: 1.2; margin-bottom: 6px; font-size: 0.85rem; }
    
    .timeline { background: #02070d; border-radius: 4px; padding: 6px; margin-bottom: 8px; font-size: 0.6rem; color: #94a3b8; border: 1px solid #1e293b; }
    .timeline div { display: flex; justify-content: space-between; }
    .timeline span { color: var(--toks-yellow); }

    /* Buton Gridleri */
    .status-grid { display: flex; gap: 3px; margin-top: auto; }
    .s-btn { flex: 1; padding: 6px 0; font-size: 0.6rem; font-weight: bold; cursor: pointer; border: 1px solid var(--border); border-radius: 4px; background: #0f172a; color: #94a3b8; text-align: center; }
    .s-btn.active-0 { background: var(--red); color: #fff; border-color: var(--red); }
    .s-btn.active-1 { background: var(--toks-yellow); color: var(--toks-navy); border-color: var(--toks-yellow); }
    .s-btn.active-2 { background: var(--blue); color: #000; border-color: var(--blue); }
    .s-btn-archive { background: var(--green); color: var(--toks-navy); border-color: var(--green); }
    
    .folder { background: #0f172a; border: 1px solid var(--border); border-radius: 8px; padding: 15px 10px; text-align: center; cursor: pointer; border-bottom: 3px solid var(--toks-navy); }
    .folder-icon { font-size: 2rem; margin-bottom: 5px; }
    .folder-name { font-weight: bold; color: #fff; font-size: 0.85rem; word-break: break-word; }
    .folder-count { font-size: 0.7rem; color: var(--toks-yellow); margin-top: 5px; }
    
    #archiveModal { display: none; margin-top: 15px; padding: 15px; background: #0f172a; border-radius: 8px; border: 1px solid var(--border); }
    .modal-title { font-size: 1.1rem; color: var(--toks-yellow); margin-bottom: 10px; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center;">
      <div class="logo">TOKS</div><div class="logo-arrow">〉</div>
    </div>
    <div class="info-widget">
      <div id="clock">Yükleniyor...</div>
      <strong id="euro-rate">€1 = Bekleniyor...</strong>
    </div>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('active')" id="tab-active">AKTİF İŞLER</div>
    <div class="tab" onclick="switchTab('archive')" id="tab-archive">ARŞİV</div>
  </div>

  <div id="view-active">
    <div class="input-panel">
      <div class="input-row">
        <input type="text" id="plate" placeholder="PLAKA (Örn: 35 TOKS 01)" oninput="this.value = this.value.toUpperCase()">
        <input type="text" id="firm" placeholder="MÜŞTERİ / FİRMA" style="width: 50%;">
      </div>
      <div class="input-row">
        <input type="text" id="receipt" placeholder="FİŞ NO (Örn: 350052)">
        <input type="number" id="price" placeholder="FİYAT (KDV HARİÇ)" style="width: 50%;">
      </div>
      <!-- Serbest Yazılabilir İşlem Alanı -->
      <input type="text" id="task" list="taskList" placeholder="YAPILACAK İŞLEMİ SEÇ VEYA YAZ">
      <datalist id="taskList">
        <option value="BRANDA YAMA">
        <option value="MERDİVEN MONTAJI">
        <option value="KAPAK TAMİRİ">
        <option value="ÇATI KALDIRMA MEKANİZMASI">
        <option value="KAYNAK İŞLEMİ">
      </datalist>
      <button class="btn" onclick="addJob()">SİSTEME KAYDET</button>
    </div>
    
    <div class="grid-container" id="jobList"></div>
  </div>

  <div id="view-archive" style="display:none;">
    <div class="grid-container" id="folderList"></div>
    <div id="archiveModal">
      <div class="modal-title" id="modalTitle"></div>
      <button class="btn" onclick="closeModal()" style="margin-bottom: 10px; background:var(--border); color:#fff;">Geri Dön</button>
      <div class="grid-container" id="modalJobs"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    setInterval(() => {
      document.getElementById('clock').innerText = new Date().toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }, 1000);

    fetch('https://open.er-api.com/v6/latest/EUR')
      .then(res => res.json())
      .then(data => { document.getElementById('euro-rate').innerText = "€1 = " + data.rates.TRY.toFixed(2) + " ₺"; })
      .catch(() => { document.getElementById('euro-rate').innerText = "Kur Alınamadı"; });

    const firebaseConfig = {
      apiKey: "AIzaSyBdJ2_Vs53h9dJq_KJciNPWix6OFvOZR5Y",
      authDomain: "toks-servis.firebaseapp.com",
      databaseURL: "https://toks-servis-default-rtdb.firebaseio.com",
      projectId: "toks-servis",
      storageBucket: "toks-servis.firebasestorage.app",
      messagingSenderId: "686093119969",
      appId: "1:686093119969:web:9c48f375479f65822062a0"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('toks_jobs');

    let jobs = [];
    let currentTab = 'active';

    db.on('value', (snapshot) => {
      jobs = snapshot.val() || [];
      renderAll();
    });

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-active').classList.toggle('active', tab === 'active');
      document.getElementById('tab-archive').classList.toggle('active', tab === 'archive');
      document.getElementById('view-active').style.display = tab === 'active' ? 'block' : 'none';
      document.getElementById('view-archive').style.display = tab === 'archive' ? 'block' : 'none';
      closeModal();
      renderAll();
    }

    function renderAll() {
      if(currentTab === 'active') renderActive();
      else renderFolders();
    }

    function renderActive() {
      const list = document.getElementById('jobList');
      list.innerHTML = '';
      
      jobs.forEach((job, index) => {
        if(job.status === 3) return;
        
        let c0 = job.status === 0 ? 'active-0' : '';
        let c1 = job.status === 1 ? 'active-1' : '';
        let c2 = job.status === 2 ? 'active-2' : '';
        let borderColor = job.status === 0 ? 'var(--red)' : (job.status === 1 ? 'var(--toks-yellow)' : 'var(--blue)');
        
        const history = job.history || { waiting: '-', inProgress: '-', finished: '-' };

        list.innerHTML += `
          <div class="job-card" style="border-top: 3px solid ${borderColor};">
            <div>
              <div class="plate">${job.plate} <span style="font-size:0.7rem; color:#94a3b8;">(Fiş: ${job.receipt || '-'})</span></div>
              <div class="firm">${job.firm}</div>
              <div class="task">${job.task}</div>
              <div class="timeline">
                <div><span>Bekliyor:</span> ${history.waiting.slice(-5)}</div>
                <div><span>İşlemde:</span> ${history.inProgress.slice(-5)}</div>
                <div><span>Bitti:</span> ${history.finished.slice(-5)}</div>
              </div>
            </div>
            <div>
              <div class="status-grid" style="margin-bottom: 4px;">
                <button class="s-btn ${c0}" onclick="updateStatus(${index}, 0)">BEKLE</button>
                <button class="s-btn ${c1}" onclick="updateStatus(${index}, 1)">İŞLEM</button>
                <button class="s-btn ${c2}" onclick="updateStatus(${index}, 2)">BİTTİ</button>
                <button class="s-btn s-btn-archive" onclick="updateStatus(${index}, 3)">ARŞİV</button>
              </div>
              <div style="display:flex; justify-content:space-between;">
                <button onclick="editJob(${index})" style="background:transparent; border:1px solid #cbd5e1; color:#cbd5e1; font-size:0.6rem; padding:2px 8px; border-radius:3px; cursor:pointer;">DÜZENLE</button>
                <button onclick="deleteJob(${index})" style="background:transparent; border:1px solid var(--red); color:var(--red); font-size:0.6rem; padding:2px 8px; border-radius:3px; cursor:pointer;">SİL</button>
              </div>
            </div>
          </div>
        `;
      });
    }

    let archiveFirms = {};
    function renderFolders() {
      const list = document.getElementById('folderList');
      list.innerHTML = '';
      archiveFirms = {};
      
      jobs.forEach((job, index) => {
        if(job.status === 3) {
          if(!archiveFirms[job.firm]) archiveFirms[job.firm] = [];
          archiveFirms[job.firm].push({ ...job, originalIndex: index });
        }
      });

      for (const [firmName, firmJobs] of Object.entries(archiveFirms)) {
        list.innerHTML += `
          <div class="folder" onclick="openModal('${firmName}')">
            <div class="folder-icon">🗂️</div>
            <div class="folder-name">${firmName}</div>
            <div class="folder-count">${firmJobs.length} İşlem</div>
          </div>
        `;
      }
    }

    function openModal(firmName) {
      document.getElementById('folderList').style.display = 'none';
      document.getElementById('archiveModal').style.display = 'block';
      document.getElementById('modalTitle').innerText = "🗂️ " + firmName;
      
      const list = document.getElementById('modalJobs');
      list.innerHTML = '';
      
      archiveFirms[firmName].forEach(job => {
        list.innerHTML += `
          <div class="job-card" style="border-top: 3px solid var(--border);">
            <div>
              <div class="plate">${job.plate} <span style="font-size:0.7rem; color:#94a3b8;">(Fiş: ${job.receipt || '-'})</span></div>
              <div class="task">${job.task}</div>
            </div>
            <div style="display:flex; gap:5px; margin-top:8px;">
              <button class="s-btn" style="background:var(--border); color:#fff;" onclick="updateStatus(${job.originalIndex}, 0)">GERİ AL</button>
              <button class="s-btn" style="background:var(--red); color:#fff;" onclick="deleteJob(${job.originalIndex})">SİL</button>
            </div>
          </div>
        `;
      });
    }

    function closeModal() {
      document.getElementById('archiveModal').style.display = 'none';
      document.getElementById('folderList').style.display = 'grid';
    }

    function addJob() {
      const plate = document.getElementById('plate').value.trim().toUpperCase();
      const firm = document.getElementById('firm').value.trim().toUpperCase() || "BİLİNMEYEN FİRMA";
      const receipt = document.getElementById('receipt').value.trim() || "-";
      const task = document.getElementById('task').value.trim().toUpperCase();
      const rawPrice = document.getElementById('price').value;
      
      if(!plate || !task) { alert("Plaka ve İşlem doldurulmak zorundadır!"); return; }
      
      let finalPrice = "";
      if (rawPrice && !isNaN(rawPrice)) {
        finalPrice = (parseFloat(rawPrice) * 1.2).toFixed(2) + " (KDV Dahil)";
      }

      const currentTime = new Date().toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
      
      jobs.push({ 
        plate, firm, receipt, task, price: finalPrice, status: 0, 
        history: { waiting: currentTime, inProgress: '-', finished: '-' }
      });
      db.set(jobs);
      
      document.getElementById('plate').value = '';
      document.getElementById('firm').value = '';
      document.getElementById('receipt').value = '';
      document.getElementById('price').value = '';
      document.getElementById('task').value = '';
    }

    function editJob(index) {
      const job = jobs[index];
      document.getElementById('plate').value = job.plate || '';
      document.getElementById('firm').value = job.firm || '';
      document.getElementById('receipt').value = job.receipt || '';
      
      if(job.price) {
        try {
          let clean = parseFloat(job.price.split(' ')[0]) / 1.2;
          document.getElementById('price').value = Math.round(clean);
        } catch(e) {}
      }
      document.getElementById('task').value = job.task || '';
      deleteJobQuiet(index);
    }

    function updateStatus(index, newStatus) {
      jobs[index].status = newStatus;
      const currentTime = new Date().toLocaleString('tr-TR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
      if(!jobs[index].history) jobs[index].history = { waiting: '-', inProgress: '-', finished: '-' };
      
      if(newStatus === 0) jobs[index].history.waiting = currentTime;
      if(newStatus === 1) jobs[index].history.inProgress = currentTime;
      if(newStatus === 2) jobs[index].history.finished = currentTime;

      db.set(jobs);
      closeModal();
    }

    function deleteJob(index) {
      if(confirm("Bu kaydı silmek istediğine emin misin?")) {
        jobs.splice(index, 1);
        db.set(jobs);
        closeModal();
      }
    }

    function deleteJobQuiet(index) {
      jobs.splice(index, 1);
      db.set(jobs);
    }
  </script>
</body>
</html>
