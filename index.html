<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TOKS SERVİS">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230B1D3A'/%3E%3Ctext x='50%25' y='53%25' dominant-baseline='middle' text-anchor='middle' font-family='-apple-system, sans-serif' font-weight='bold' font-size='380' fill='%23FFFFFF'%3ET%3C/text%3E%3C/svg%3E">
  <title>TRON // TOKS SERVİS</title>
  <style>
    :root { --neon: #00e5ff; --neon-glow: rgba(0, 229, 255, 0.4); --bg: #06090e; --card-bg: rgba(10, 20, 30, 0.85); --border: #00e5ff55; --red: #ff0055; --yellow: #ffcc00; --green: #00ff66; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "SF Mono", monospace; }
    body { background-color: var(--bg); color: var(--neon); padding: 15px; min-height: 100vh; }
    header { border-bottom: 2px solid var(--neon); padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; text-shadow: 0 0 10px var(--neon-glow); }
    h1 { font-size: 1.2rem; letter-spacing: 2px; }
    .input-panel { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; margin-bottom: 15px; clip-path: polygon(0 0, 95% 0, 100% 15px, 100% 100%, 0 100%); }
    input { width: 100%; background: #02070d; border: 1px solid var(--border); color: var(--neon); padding: 10px; margin-bottom: 10px; font-size: 1rem; outline: none; text-transform: uppercase; }
    input:focus { border-color: var(--neon); box-shadow: 0 0 8px var(--neon-glow); }
    .btn { width: 100%; background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 12px; font-weight: bold; letter-spacing: 1px; cursor: pointer; box-shadow: 0 0 10px var(--neon-glow); }
    .btn:active { background: var(--neon); color: #000; }
    .job-card { background: var(--card-bg); border: 1px solid var(--border); padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; border-left: 4px solid var(--neon); }
    .job-header { display: flex; justify-content: space-between; align-items: center; }
    .plate { font-size: 1.2rem; font-weight: bold; color: #fff; letter-spacing: 2px; }
    .firm { font-size: 0.8rem; color: #78a6c8; }
    .task { font-size: 0.95rem; color: var(--neon); padding-top: 5px; border-top: 1px dashed var(--border); }
    .status-bar { display: flex; gap: 5px; margin-top: 5px; }
    .s-btn { flex: 1; padding: 6px; font-size: 0.75rem; font-weight: bold; background: transparent; border: 1px solid #333; color: #666; cursor: pointer; }
    .s-btn.active-0 { border-color: var(--red); color: var(--red); box-shadow: 0 0 8px rgba(255,0,85,0.4); }
    .s-btn.active-1 { border-color: var(--yellow); color: var(--yellow); box-shadow: 0 0 8px rgba(255,204,0,0.4); }
    .s-btn.active-2 { border-color: var(--green); color: var(--green); box-shadow: 0 0 8px rgba(0,255,102,0.4); }
    .delete-btn { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 6px; font-size: 0.75rem; width: 100%; margin-top: 5px; }
  </style>
</head>
<body>

  <header>
    <h1>TOKS // SİSTEM</h1>
    <div id="connectionStatus" style="font-size: 0.75rem; color: var(--yellow);">BAĞLANIYOR...</div>
  </header>

  <div class="input-panel">
    <input type="text" id="plate" placeholder="PLAKA (Örn: 35 TOKS 01)">
    <input type="text" id="firm" placeholder="MÜŞTERİ / FİRMA">
    <input type="text" id="task" placeholder="YAPILACAK İŞLEM (Branda, Çatı Kaldırma vb.)">
    <button class="btn" onclick="addJob()">[+] SERVİSE AL</button>
  </div>

  <div id="jobList"></div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // Kendi Firebase Şifrelerin Sisteme Eklendi
    const firebaseConfig = {
      apiKey: "AIzaSyBdJ2_Vs53h9dJq_KJciNPWix6OFvOZR5Y",
      authDomain: "toks-servis.firebaseapp.com",
      databaseURL: "https://toks-servis-default-rtdb.firebaseio.com",
      projectId: "toks-servis",
      storageBucket: "toks-servis.firebasestorage.app",
      messagingSenderId: "686093119969",
      appId: "1:686093119969:web:9c48f375479f65822062a0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('toks_jobs');

    let jobs = [];

    db.on('value', (snapshot) => {
      jobs = snapshot.val() || [];
      document.getElementById('connectionStatus').innerText = "ONLINE";
      document.getElementById('connectionStatus').style.color = "var(--green)";
      renderList();
    });

    function renderList() {
      const list = document.getElementById('jobList');
      list.innerHTML = '';
      
      jobs.forEach((job, index) => {
        let bClass = job.status === 0 ? 'active-0' : '';
        let iClass = job.status === 1 ? 'active-1' : '';
        let tClass = job.status === 2 ? 'active-2' : '';
        let borderColor = job.status === 0 ? 'var(--red)' : (job.status === 1 ? 'var(--yellow)' : 'var(--green)');

        list.innerHTML += `
          <div class="job-card" style="border-left-color: ${borderColor};">
            <div class="job-header">
              <div class="plate">${job.plate}</div>
              <div class="firm">${job.firm}</div>
            </div>
            <div class="task">> ${job.task}</div>
            
            <div class="status-bar">
              <button class="s-btn ${bClass}" onclick="updateStatus(${index}, 0)">BEKLİYOR</button>
              <button class="s-btn ${iClass}" onclick="updateStatus(${index}, 1)">İŞLEMDE</button>
              <button class="s-btn ${tClass}" onclick="updateStatus(${index}, 2)">BİTTİ</button>
            </div>
            <button class="delete-btn" onclick="deleteJob(${index})">KAYDI SİL</button>
          </div>
        `;
      });
    }

    function addJob() {
      const plate = document.getElementById('plate').value.trim().toUpperCase();
      const firm = document.getElementById('firm').value.trim().toUpperCase();
      const task = document.getElementById('task').value.trim().toUpperCase();
      if(!plate || !task) { alert("Plaka ve İşlem girmek zorunludur!"); return; }
      jobs.push({ plate, firm, task, status: 0 });
      db.set(jobs);
      document.getElementById('plate').value = '';
      document.getElementById('firm').value = '';
      document.getElementById('task').value = '';
    }

    function updateStatus(index, newStatus) {
      jobs[index].status = newStatus;
      db.set(jobs);
    }

    function deleteJob(index) {
      if(confirm("Bu kaydı silmek istediğine emin misin?")) {
        jobs.splice(index, 1);
        db.set(jobs);
      }
    }
  </script>
</body>
</html>
