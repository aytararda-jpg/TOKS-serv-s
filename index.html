<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TOKS SERVİS">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230B1D3A'/%3E%3Ctext x='50%25' y='53%25' dominant-baseline='middle' text-anchor='middle' font-family='-apple-system, sans-serif' font-weight='bold' font-size='380' fill='%23FFFFFF'%3ET%3C/text%3E%3C/svg%3E">
  <title>TRON // TOKS SERVİS</title>
  <style>
    :root { --neon: #00e5ff; --neon-glow: rgba(0, 229, 255, 0.4); --bg: #06090e; --card-bg: rgba(10, 20, 30, 0.85); --border: #00e5ff55; --red: #ff0055; --yellow: #ffcc00; --green: #00ff66; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, "SF Mono", monospace; }
    body { background-color: var(--bg); color: var(--neon); padding: 15px; min-height: 100vh; }
    header { border-bottom: 2px solid var(--neon); padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; text-shadow: 0 0 10px var(--neon-glow); }
    h1 { font-size: 1.2rem; letter-spacing: 2px; }
    
    /* Sekme (Tab) Tasarımı */
    .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab { flex: 1; padding: 10px; text-align: center; border: 1px solid var(--neon); color: var(--neon); cursor: pointer; font-weight: bold; background: transparent; transition: 0.3s; }
    .tab.active { background: var(--neon); color: #000; box-shadow: 0 0 10px var(--neon-glow); }

    .input-panel { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; margin-bottom: 15px; clip-path: polygon(0 0, 95% 0, 100% 15px, 100% 100%, 0 100%); }
    input, select { width: 100%; background: #02070d; border: 1px solid var(--border); color: var(--neon); padding: 10px; margin-bottom: 10px; font-size: 1rem; outline: none; text-transform: uppercase; appearance: none; }
    input:focus, select:focus { border-color: var(--neon); box-shadow: 0 0 8px var(--neon-glow); }
    select option { background: var(--bg); color: var(--neon); }
    
    .btn { width: 100%; background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 12px; font-weight: bold; letter-spacing: 1px; cursor: pointer; box-shadow: 0 0 10px var(--neon-glow); margin-top: 5px; }
    .btn:active { background: var(--neon); color: #000; }

    .job-card { background: var(--card-bg); border: 1px solid var(--border); padding: 12px; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; border-left: 4px solid var(--neon); }
    .job-header { display: flex; justify-content: space-between; align-items: center; }
    .plate { font-size: 1.2rem; font-weight: bold; color: #fff; letter-spacing: 2px; }
    .firm { font-size: 0.8rem; color: #78a6c8; }
    .task { font-size: 0.95rem; color: var(--neon); padding-top: 5px; border-top: 1px dashed var(--border); }
    
    .status-bar { display: flex; gap: 5px; margin-top: 5px; }
    .s-btn { flex: 1; padding: 6px; font-size: 0.75rem; font-weight: bold; background: transparent; border: 1px solid #333; color: #666; cursor: pointer; }
    .s-btn.active-0 { border-color: var(--red); color: var(--red); box-shadow: 0 0 8px rgba(255,0,85,0.4); }
    .s-btn.active-1 { border-color: var(--yellow); color: var(--yellow); box-shadow: 0 0 8px rgba(255,204,0,0.4); }
    .s-btn.active-2 { border-color: var(--green); color: var(--green); box-shadow: 0 0 8px rgba(0,255,102,0.4); }
    .delete-btn { background: transparent; border: 1px solid var(--red); color: var(--red); padding: 6px; font-size: 0.75rem; width: 100%; margin-top: 5px; }

    /* Klasörleme Tasarımı */
    .firm-folder { background: #02070d; border: 1px solid var(--border); margin-bottom: 10px; }
    .firm-title { padding: 12px; font-weight: bold; color: var(--green); cursor: pointer; display: flex; justify-content: space-between; border-left: 4px solid var(--green); }
    .firm-content { padding: 10px; display: none; background: rgba(10, 20, 30, 0.5); border-top: 1px solid var(--border); }
  </style>
</head>
<body>

  <header>
    <h1>TOKS // SİSTEM</h1>
    <div id="connectionStatus" style="font-size: 0.75rem; color: var(--yellow);">BAĞLANTI ARANIYOR...</div>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('active')" id="tab-active">AKTİF İŞLER</div>
    <div class="tab" onclick="switchTab('archive')" id="tab-archive">BİTENLER (ARŞİV)</div>
  </div>

  <div id="view-active">
    <div class="input-panel">
      <input type="text" id="plate" placeholder="PLAKA (Örn: 35 TOKS 01)">
      <input type="text" id="firm" placeholder="MÜŞTERİ / FİRMA">
      <select id="task">
        <option value="" disabled selected>-- YAPILACAK İŞLEMİ SEÇ --</option>
        <option value="BRANDA YAMA">Branda Yama</option>
        <option value="MERDİVEN MONTAJI">Merdiven Montajı</option>
        <option value="KAPAK TAMİRİ">Kapak Tamiri</option>
        <option value="ÇATI KALDIRMA MEKANİZMASI">Çatı Kaldırma Mekanizması</option>
        <option value="KAYNAK İŞLEMİ">Kaynak İşlemi</option>
        <option value="DİĞER (ÖZEL İŞLEM)">Diğer (Özel İşlem)</option>
      </select>
      <input type="text" id="customTask" placeholder="ÖZEL İŞLEMİ YAZIN" style="display:none; margin-top:10px;">
      <button class="btn" onclick="addJob()">[+] SERVİSE AL</button>
    </div>
    <div id="jobList"></div>
  </div>

  <div id="view-archive" style="display:none;">
    <div id="archiveList"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    // FİREBASE ŞİFRELERİN
    const firebaseConfig = {
      apiKey: "AIzaSyBdJ2_Vs53h9dJq_KJciNPWix6OFvOZR5Y",
      authDomain: "toks-servis.firebaseapp.com",
      databaseURL: "https://toks-servis-default-rtdb.firebaseio.com",
      projectId: "toks-servis",
      storageBucket: "toks-servis.firebasestorage.app",
      messagingSenderId: "686093119969",
      appId: "1:686093119969:web:9c48f375479f65822062a0"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref('toks_jobs');

    // Bağlantı Radar Sensörü
    firebase.database().ref('.info/connected').on('value', function(snap) {
      const statusDiv = document.getElementById('connectionStatus');
      if (snap.val() === true) {
        statusDiv.innerText = "ONLINE";
        statusDiv.style.color = "var(--green)";
      } else {
        statusDiv.innerText = "BAĞLANIYOR...";
        statusDiv.style.color = "var(--yellow)";
      }
    });

    let jobs = [];
    let currentTab = 'active';

    // "Diğer" seçilirse metin kutusunu aç
    document.getElementById('task').addEventListener('change', function() {
      const customInput = document.getElementById('customTask');
      customInput.style.display = this.value === "DİĞER (ÖZEL İŞLEM)" ? "block" : "none";
    });

    db.on('value', (snapshot) => {
      jobs = snapshot.val() || [];
      renderAll();
    });

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tab-active').classList.toggle('active', tab === 'active');
      document.getElementById('tab-archive').classList.toggle('active', tab === 'archive');
      document.getElementById('view-active').style.display = tab === 'active' ? 'block' : 'none';
      document.getElementById('view-archive').style.display = tab === 'archive' ? 'block' : 'none';
      renderAll();
    }

    function renderAll() {
      if(currentTab === 'active') renderActive();
      else renderArchive();
    }

    function renderActive() {
      const list = document.getElementById('jobList');
      list.innerHTML = '';
      
      jobs.forEach((job, index) => {
        if(job.status === 2) return; // Bitenleri aktifte gösterme
        
        let bClass = job.status === 0 ? 'active-0' : '';
        let iClass = job.status === 1 ? 'active-1' : '';
        let borderColor = job.status === 0 ? 'var(--red)' : 'var(--yellow)';

        list.innerHTML += `
          <div class="job-card" style="border-left-color: ${borderColor};">
            <div class="job-header">
              <div class="plate">${job.plate}</div>
              <div class="firm">${job.firm}</div>
            </div>
            <div class="task">> ${job.task}</div>
            
            <div class="status-bar">
              <button class="s-btn ${bClass}" onclick="updateStatus(${index}, 0)">BEKLİYOR</button>
              <button class="s-btn ${iClass}" onclick="updateStatus(${index}, 1)">İŞLEMDE</button>
              <button class="s-btn" onclick="updateStatus(${index}, 2)">BİTTİ (ARŞİVE AT)</button>
            </div>
            <button class="delete-btn" onclick="deleteJob(${index})">KAYDI SİL</button>
          </div>
        `;
      });
    }

    function renderArchive() {
      const list = document.getElementById('archiveList');
      list.innerHTML = '';
      
      let firms = {};
      
      // Biten işleri firmalara göre grupla
      jobs.forEach((job, index) => {
        if(job.status === 2) {
          if(!firms[job.firm]) firms[job.firm] = [];
          firms[job.firm].push({ ...job, originalIndex: index });
        }
      });

      // Gruplanan klasörleri ekrana bas
      for (const [firmName, firmJobs] of Object.entries(firms)) {
        let folderHTML = `<div class="firm-folder">
            <div class="firm-title" onclick="toggleFolder('${firmName}')">
              <span>🗂 ${firmName}</span>
              <span>[${firmJobs.length} İşlem] </span>
            </div>
            <div class="firm-content" id="folder-${firmName}">`;
        
        firmJobs.forEach(job => {
          folderHTML += `
            <div class="job-card" style="border-left-color: var(--green);">
              <div class="job-header">
                <div class="plate">${job.plate}</div>
              </div>
              <div class="task">> ${job.task}</div>
              <div class="status-bar">
                <button class="s-btn" onclick="updateStatus(${job.originalIndex}, 1)">GERİ AL (İŞLEMDE)</button>
              </div>
              <button class="delete-btn" onclick="deleteJob(${job.originalIndex})">KAYDI SİL</button>
            </div>
          `;
        });

        folderHTML += `</div></div>`;
        list.innerHTML += folderHTML;
      }
      
      if(Object.keys(firms).length === 0) {
        list.innerHTML = "<p style='color:var(--neon); text-align:center;'>Arşivde bitmiş iş bulunmuyor.</p>";
      }
    }

    function toggleFolder(firmName) {
      const folder = document.getElementById(`folder-${firmName}`);
      folder.style.display = folder.style.display === "block" ? "none" : "block";
    }

    function addJob() {
      const plate = document.getElementById('plate').value.trim().toUpperCase();
      const firm = document.getElementById('firm').value.trim().toUpperCase() || "BİLİNMEYEN FİRMA";
      const taskSelect = document.getElementById('task').value;
      const customTask = document.getElementById('customTask').value.trim().toUpperCase();
      
      let finalTask = taskSelect;
      if(taskSelect === "DİĞER (ÖZEL İŞLEM)") {
        finalTask = customTask;
      }
      
      if(!plate || !finalTask) { alert("Plaka ve İşlem seçmek zorunludur!"); return; }
      
      jobs.push({ plate, firm, task: finalTask, status: 0 });
      db.set(jobs);
      
      document.getElementById('plate').value = '';
      document.getElementById('firm').value = '';
      document.getElementById('task').value = '';
      document.getElementById('customTask').value = '';
      document.getElementById('customTask').style.display = 'none';
    }

    function updateStatus(index, newStatus) {
      jobs[index].status = newStatus;
      db.set(jobs);
    }

    function deleteJob(index) {
      if(confirm("Bu kaydı kalıcı olarak silmek istediğine emin misin?")) {
        jobs.splice(index, 1);
        db.set(jobs);
      }
    }
  </script>
</body>
</html>
